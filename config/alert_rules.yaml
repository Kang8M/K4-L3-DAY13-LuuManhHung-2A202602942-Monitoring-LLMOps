alerts:
  - name: HighLatencyP95
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: on-call-backend
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: on-call-backend
    runbook: docs/alerts.md#alert-2
  - name: CostBudgetBurn
    severity: warning
    condition: cost_usd_sum_5m > 0.50
    duration: 10m
    type: symptom-based
    channel: slack
    owner: on-call-platform
    runbook: docs/alerts.md#alert-3
